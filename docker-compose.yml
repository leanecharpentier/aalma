services:
  postgres:
    image: postgres:16
    container_name: aalma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aalma
    ports:
      - "5432:5432"
    volumes:
      - aalma_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aalma"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aalma_pg_data: